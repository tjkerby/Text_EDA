[project]
name = "stat386-text-eda"
version = "0.2.0"
description = "A step-by-step introduction to text embeddings and exploratory visualization"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.5,<2",
    "ollama>=0.4,<1",
    "phate>=1.0.11,<3",
    "plotly>=5.20,<7",
    "ipykernel>=6.29,<8",
    "nbformat>=5.9,<6",
    "nbclient>=0.10,<1",
]

[tool.uv]
package = false
